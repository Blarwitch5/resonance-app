<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121018" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Resonance</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("resonance-theme") || "auto";
          var d =
            t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
              ? "dark"
              : "light";
          var bg = d === "dark" ? "#121018" : "#f6f4f8";
          document.documentElement.setAttribute("data-theme", d);
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.colorScheme = d;
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f6f4f8;
        color: #14101c;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #121018;
        color: #f5f3f8;
      }
      main {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        text-align: center;
      }
      img {
        width: 4.5rem;
        height: auto;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        opacity: 0.72;
      }
      a {
        color: inherit;
        font-size: 0.875rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-resonance.svg" alt="" width="72" height="72" />
      <p>The shelf is settling…</p>
      <p lang="fr">L’étagère se pose…</p>
      <p><a href="/collection">Open Collection</a> · <a href="/collection" lang="fr">Ouvrir la Collection</a></p>
    </main>
  </body>
</html>
